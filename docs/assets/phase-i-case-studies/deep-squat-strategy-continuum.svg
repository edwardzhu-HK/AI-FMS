  <circle cx="140.5" cy="622.4" r="9" fill="#7c3aed" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
  <circle cx="323.4" cy="318.4" r="9" fill="#4d7c0f" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
  <circle cx="578.1" cy="263.2" r="9" fill="#4d7c0f" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
