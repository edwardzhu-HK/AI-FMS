  <circle cx="530.6" cy="419.9" r="9" fill="#475569" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
  <circle cx="715.0" cy="227.9" r="9" fill="#2563eb" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
  <circle cx="592.5" cy="261.6" r="9" fill="#4d7c0f" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
  <circle cx="525.3" cy="346.6" r="9" fill="#475569" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
  <rect x="835" y="150" width="325" height="390" fill="#f8fafc" stroke="#dbe2ea"/>
  <text x="865" y="188" font-size="18" font-weight="700" fill="#172033">Spearman vs depth</text>
  <text x="865" y="225" font-size="15" fill="#172033">Hip-knee gap</text>
  <text x="1125" y="225" text-anchor="end" font-size="16" font-weight="700" fill="#172033">ρ 0.70</text>
  <text x="865" y="271" font-size="15" fill="#172033">Hip angle</text>
  <text x="1125" y="271" text-anchor="end" font-size="16" font-weight="700" fill="#172033">ρ -0.69</text>
  <text x="865" y="317" font-size="15" fill="#172033">Knee angle</text>
  <text x="1125" y="317" text-anchor="end" font-size="16" font-weight="700" fill="#172033">ρ -0.85</text>
  <text x="865" y="363" font-size="15" fill="#172033">Shank lean</text>
  <text x="1125" y="363" text-anchor="end" font-size="16" font-weight="700" fill="#172033">ρ -0.20</text>
  <text x="865" y="409" font-size="15" fill="#172033">Trunk lean</text>
  <text x="1125" y="409" text-anchor="end" font-size="16" font-weight="700" fill="#172033">ρ -0.05</text>
  <text x="865" y="455" font-size="15" fill="#172033">Knee-ankle offset</text>
  <text x="1125" y="455" text-anchor="end" font-size="16" font-weight="700" fill="#172033">ρ -0.12</text>
  <rect x="835" y="565" width="325" height="85" fill="#eef6f5"/>
  <text x="855" y="596" font-size="15" font-weight="700" fill="#172033">Depth tracks hip/knee flexion.</text>
  <text x="855" y="622" font-size="14" fill="#526074">Ankle, trunk and alignment remain</text>
  <text x="855" y="644" font-size="14" fill="#526074">partly independent strategy dimensions.</text>
  <text x="42" y="742" font-size="12" fill="#64748b">Exploratory 2D pose evidence. Repetitions are nested within source videos; source-median sensitivity is retained in the research artifact.</text>
</svg>
