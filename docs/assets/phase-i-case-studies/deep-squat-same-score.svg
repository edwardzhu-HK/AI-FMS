<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Same FMS score, different Deep Squat movement profile</title>
  <desc id="desc">Two side-view Deep Squat repetitions both received human score 2 but show different pose-derived depth, hip, knee, ankle, and alignment features.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="8" fill="#172033"/>
  <text x="42" y="60" font-size="34" font-weight="750" fill="#172033">Same FMS Score, Different Movement Profile</text>
  <text x="42" y="91" font-size="16" fill="#526074">Deep Squat · two different source videos · audited side view · human RAW SCORE 2</text>
  <circle cx="341" cy="137" r="18" fill="#0f766e"/>
  <text x="341" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="370" y="143" font-size="17" font-weight="700" fill="#0f766e">Case A · shallower / uncertain depth</text>
  <circle cx="776" cy="137" r="18" fill="#d97706"/>
  <text x="776" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="805" y="143" font-size="17" font-weight="700" fill="#d97706">Case B · deeper movement</text>
  <line x1="42" y1="169" x2="1158" y2="169" stroke="#dbe2ea"/>
  
  <text x="42" y="220" font-size="16" font-weight="650" fill="#172033">Peak depth ratio</text>
  <text x="42" y="242" font-size="12" fill="#64748b">normalized ratio</text>
  <rect x="325" y="205" width="260" height="16" rx="3" fill="#dbe7e5"/>
  <rect x="325" y="205" width="227.5" height="16" rx="3" fill="#0f766e"/>
  <text x="600" y="218" font-size="14" font-weight="650" fill="#172033">0.6600</text>
  <rect x="760" y="205" width="260" height="16" rx="3" fill="#f4e5cd"/>
  <rect x="760" y="205" width="260.0" height="16" rx="3" fill="#d97706"/>
  <text x="1035" y="218" font-size="14" font-weight="650" fill="#172033">0.7542</text>
  
  <text x="42" y="298" font-size="16" font-weight="650" fill="#172033">Hip-knee vertical gap</text>
  <text x="42" y="320" font-size="12" fill="#64748b">normalized height</text>
  <rect x="325" y="283" width="260" height="16" rx="3" fill="#dbe7e5"/>
  <rect x="325" y="283" width="46.7" height="16" rx="3" fill="#0f766e"/>
  <text x="600" y="296" font-size="14" font-weight="650" fill="#172033">-0.0121</text>
  <rect x="760" y="283" width="260" height="16" rx="3" fill="#f4e5cd"/>
  <rect x="760" y="283" width="260.0" height="16" rx="3" fill="#d97706"/>
  <text x="1035" y="296" font-size="14" font-weight="650" fill="#172033">0.0673</text>
  
  <text x="42" y="376" font-size="16" font-weight="650" fill="#172033">Hip angle</text>
  <text x="42" y="398" font-size="12" fill="#64748b">degrees</text>
  <rect x="325" y="361" width="260" height="16" rx="3" fill="#dbe7e5"/>
  <rect x="325" y="361" width="260.0" height="16" rx="3" fill="#0f766e"/>
  <text x="600" y="374" font-size="14" font-weight="650" fill="#172033">86.3</text>
  <rect x="760" y="361" width="260" height="16" rx="3" fill="#f4e5cd"/>
  <rect x="760" y="361" width="128.9" height="16" rx="3" fill="#d97706"/>
  <text x="1035" y="374" font-size="14" font-weight="650" fill="#172033">42.8</text>
  
  <text x="42" y="454" font-size="16" font-weight="650" fill="#172033">Knee angle</text>
  <text x="42" y="476" font-size="12" fill="#64748b">degrees</text>
  <rect x="325" y="439" width="260" height="16" rx="3" fill="#dbe7e5"/>
  <rect x="325" y="439" width="260.0" height="16" rx="3" fill="#0f766e"/>
  <text x="600" y="452" font-size="14" font-weight="650" fill="#172033">64.9</text>
  <rect x="760" y="439" width="260" height="16" rx="3" fill="#f4e5cd"/>
  <rect x="760" y="439" width="140.2" height="16" rx="3" fill="#d97706"/>
  <text x="1035" y="452" font-size="14" font-weight="650" fill="#172033">35.0</text>
  
  <text x="42" y="532" font-size="16" font-weight="650" fill="#172033">Ankle-shank lean</text>
  <text x="42" y="554" font-size="12" fill="#64748b">degrees</text>
  <rect x="325" y="517" width="260" height="16" rx="3" fill="#dbe7e5"/>
  <rect x="325" y="517" width="260.0" height="16" rx="3" fill="#0f766e"/>
  <text x="600" y="530" font-size="14" font-weight="650" fill="#172033">32.4</text>
  <rect x="760" y="517" width="260" height="16" rx="3" fill="#f4e5cd"/>
  <rect x="760" y="517" width="121.2" height="16" rx="3" fill="#d97706"/>
  <text x="1035" y="530" font-size="14" font-weight="650" fill="#172033">15.1</text>
  
  <text x="42" y="610" font-size="16" font-weight="650" fill="#172033">Knee-ankle offset</text>
  <text x="42" y="632" font-size="12" fill="#64748b">normalized width</text>
  <rect x="325" y="595" width="260" height="16" rx="3" fill="#dbe7e5"/>
  <rect x="325" y="595" width="260.0" height="16" rx="3" fill="#0f766e"/>
  <text x="600" y="608" font-size="14" font-weight="650" fill="#172033">0.0709</text>
  <rect x="760" y="595" width="260" height="16" rx="3" fill="#f4e5cd"/>
  <rect x="760" y="595" width="147.8" height="16" rx="3" fill="#d97706"/>
  <text x="1035" y="608" font-size="14" font-weight="650" fill="#172033">0.0403</text>
  <rect x="0" y="680" width="1200" height="80" fill="#eef6f5"/>
  <text x="42" y="712" font-size="18" font-weight="700" fill="#172033">The ordinal score is preserved; the quantitative profile adds how the movement was completed.</text>
  <text x="42" y="739" font-size="13" fill="#526074">Pose-derived 2D proxies, not clinical goniometry or a diagnosis. Bar length is scaled within each feature row; numeric values are authoritative.</text>
</svg>
